<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tanai Milanović</title>

  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
  background:
    linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.6)),
    url("background.jpg") center 50% / cover no-repeat;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;

    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid rgba(255,255,255,0.2);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    p {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .links a {
      display: block;
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      transition: 0.3s;
    }

    .links a:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }

    @media (max-width: 500px) {
      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="profile.jpg" alt="Profilna slika" class="profile-img">

    <h1>Tanai Milanoić</h1>
    <p>Študent FSUM, član AK Ptuj</p>

    <div class="links">
      <a href="https://www.instagram.com/tanai_milanovic?igsh=MWN0aG9kYjkzbDV3MQ==" target="_blank">Instagram</a>
      <a href="https://www.weglide.org/user/33577" target="_blank">WeGlide</a>
      <a href="mailto:tanai.milanovic@gmail.com">Kontakt</a>
    </div>
  </div>
</body>
</html>
